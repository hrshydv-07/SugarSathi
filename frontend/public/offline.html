<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F2942" />
  <meta name="description" content="DiaCare Senior is in Offline Mode. Your diabetes care routine and records are saved locally." />
  <title>DiaCare Senior — Offline Mode</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0F2942;
      --secondary: #0D9488;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(15, 41, 66, 0.08);
    }
    .icon-badge {
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      background: #F0FDFA;
      color: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: var(--primary);
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 0.875rem 1.5rem;
      border-radius: 0.75rem;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn:hover {
      background: #1E3A8A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">📶</div>
    <h1>You are currently offline</h1>
    <p>
      Don't worry! <strong>DiaCare Senior</strong> saves your blood sugar readings and medicine updates on your phone.
      Everything will sync automatically as soon as internet connection returns.
    </p>
    <a href="/patient" class="btn">Return to Senior Dashboard</a>
  </div>
</body>
</html>
